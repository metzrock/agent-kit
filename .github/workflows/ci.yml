name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck jq
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: AGENT_KIT_CI=1 tools/leak-check --all
      - run: tools/lint
      - run: tests/run
